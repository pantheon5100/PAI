name: tsbad
# Reference environment for the TSB-AD release workflow.
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.4
  - pytorch-cuda=12.1
  - numpy=1.26
  - pandas=2.2
  - scikit-learn=1.4
  - scipy
  - bottleneck
  - statsmodels
  - tensorboard=2.20
  - transformers
  - tsfm-public  # IBM Granite TSPulse dependencies
  - pip
  - pip:
    - granite-timeseries-tspulse
    # Baseline source code is vendored under third_party/ and added to
    # PYTHONPATH by code/setup_env.sh or by individual runners.
